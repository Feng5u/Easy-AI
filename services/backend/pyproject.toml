[project]
name = "easyai-backend"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi==0.128.0", "uvicorn==0.40.0", "pydantic==2.12.5", "paramiko==4.0.0"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "httpx==0.28.1",
    "ruff==0.14.13",
    "mypy==1.19.1",
    "pyinstaller==6.18.0",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/easyai"]
