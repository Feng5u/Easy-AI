name: application-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.23
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - name: Project persistence and native lock lifecycle
        working-directory: services/backend
        run: uv run --frozen pytest -q tests/test_project_persistence.py
      - name: Experimental NTFS storage readiness (production gate remains off)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        working-directory: services/backend
        run: uv run --frozen pytest -q tests/test_windows_storage_contract.py tests/test_windows_native_store.py
      - name: Freeze backend including experimental native ABI module
        id: freeze_backend
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: node scripts/python-task.mjs build
      - name: Frozen backend HTTP and resource gates
        if: ${{ !cancelled() && steps.freeze_backend.outcome == 'success' }}
        timeout-minutes: 2
        run: node scripts/test-frozen-ssh.mjs
      - run: pnpm --filter @easyai/desktop build
      - run: pnpm test:e2e
